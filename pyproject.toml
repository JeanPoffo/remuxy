[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remuxy"
dynamic = ["version"]
description = "Adds the audio track of one movie (e.g. a dub) to another, in sync, with a CLI and a TUI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Jean" }]
keywords = ["ffmpeg", "remux", "audio", "sync", "dvd", "dubbing", "tui"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "textual>=0.80",
    "numpy>=1.21",
]

[project.scripts]
remux = "remuxy.remux:cli"
remuxy = "remuxy.remuxy:main"

[tool.hatch.version]
path = "src/remuxy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/remuxy"]
